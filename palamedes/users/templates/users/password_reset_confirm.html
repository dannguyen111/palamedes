{% extends "homepage/base.html" %}

{% block container_class %}container--narrow{% endblock %}
{% block page_header %}{% endblock %}

{% block content %}

<div class="stack" style="margin-bottom:var(--sp-6)">
    <p class="eyebrow">Password</p>
    <h1>Choose a new password</h1>
</div>

<div class="card">
    <div class="card__body">
        <form method="post">
            {% csrf_token %}
            {% include "components/form.html" with form=form %}
            <button type="submit" class="btn btn--primary btn--block">Save new password</button>
        </form>
    </div>
</div>

{% endblock %}
